[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "cofdraw"
version = "0.8.0"
description = "Offline Windows drawing studio for finite COF pore patches and monomers"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "Pillow>=10", "rdkit>=2024.3", "numpy>=1.26", "raspalib==3.1.0",
  "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.9", "resvg-py>=0.5.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "scipy>=1.11"]
desktop = ["pywebview==6.2.1", "pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cof_vision = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
