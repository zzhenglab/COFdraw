name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cofdraw-desktop.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop and test dependencies
        run: python -m pip install -r requirements-cofdraw-desktop.txt "pytest>=8" "httpx>=0.27" "scipy>=1.11"
      - name: Run chemistry, export, and desktop API tests
        run: python -m pytest -q
      - name: Check monomer library behavior
        run: node scripts/test_cofdraw_library.cjs
      - name: Check automatic chemistry choices
        run: node scripts/test_cofdraw_automatic.cjs
