name: macOS beta
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both verified downloads as a Mac prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cofdraw-desktop.txt
      - name: Install desktop dependencies
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          python -m venv "$RUNNER_TEMP/cofdraw-env"
          source "$RUNNER_TEMP/cofdraw-env/bin/activate"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          constraints=requirements-cofdraw-desktop.txt
          if [[ "$(uname -m)" == x86_64 ]]; then
            # Last release with a native Intel Mac wheel for Python 3.11.
            sed 's/^rdkit==.*/rdkit==2025.9.3/' "$constraints" > "$RUNNER_TEMP/intel-constraints.txt"
            constraints="$RUNNER_TEMP/intel-constraints.txt"
          fi
          python -m pip install -c "$constraints" --only-binary=rdkit,raspalib,numpy,resvg-py '.[desktop]'
      - name: Package the application
        run: python scripts/build_cofdraw_macos.py
      - name: Launch and exercise the extracted archive
        run: python scripts/smoke_cofdraw_macos.py dist/COFdraw-macOS-${{ matrix.arch }}.zip
      - name: Show application startup diagnostics on failure
        if: failure()
        run: tail -60 "$HOME/Library/Application Support/COFdraw/cofdraw.log" || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/COFdraw-macOS-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: package
    if: inputs.publish && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          merge-multiple: true
          path: dist
      - name: Publish Mac beta
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("../pyproject.toml","rb"))["project"]["version"])')
          tag="v${version}-mac-beta.${GITHUB_RUN_NUMBER}"
          cat COFdraw-macOS-{arm64,x86_64}.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
            --title "COFdraw $version · Mac beta $GITHUB_RUN_NUMBER" \
            --notes-file ../packaging/macos-release.md COFdraw-macOS-{arm64,x86_64}.zip SHA256SUMS.txt
          gh release edit "$tag" --draft=false --prerelease --latest=false
